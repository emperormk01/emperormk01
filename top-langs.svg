    .pct { font-size: 11px; fill: #8b949e; }
  </style>
  <rect x="0.5" y="0.5" width="299" height="199" rx="6" fill="#0d1117" stroke="#30363d"/>
  <text x="20" y="28" class="title">Most Used Languages</text>
  <g>
    <circle cx="28" cy="52" r="5" fill="#3178c6"/>
    <text x="40" y="56" class="lang">TypeScript</text>
