<svg xmlns="http://www.w3.org/2000/svg" width="300" height="200" viewBox="0 0 300 200">
  <style>
    text { font-family: -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
    .title { font-size: 13px; font-weight: 600; fill: #f0f6fc; }
