    <text x="252" y="128" class="pct">4.0%</text>
    <circle cx="28" cy="148" r="5" fill="#00ADD8"/>
    <text x="40" y="152" class="lang">Go</text>
    <text x="252" y="152" class="pct">1.1%</text>
    <circle cx="28" cy="172" r="5" fill="#e34c26"/>
